<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>دخول الفريق، شُرفة</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-login">
<main class="login-main" id="main">
<img class="login-logo" src="/assets/images/logo/logo-horizontal.svg" alt="شُرفة" height="40">
<h1>دخول الفريق</h1>
<p class="support muted">أدخل بريدك وكلمة المرور للوصول إلى لوحة الإدارة.</p>
<div id="login-status" aria-live="polite"></div>
<form id="login-form" novalidate>
<div class="field">
<label class="field-label" for="email">البريد الإلكتروني</label>
<input class="input" id="email" name="email" type="email" autocomplete="username" required aria-describedby="email-error">
<p class="field-error" id="email-error" aria-live="polite"></p>
</div>
<div class="field">
<label class="field-label" for="password">كلمة المرور</label>
<input class="input" id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-error">
<p class="field-error" id="password-error" aria-live="polite"></p>
</div>
<button class="btn" type="submit" id="login-submit">دخول</button>
</form>
<p class="support muted"><a href="/">العودة إلى الموقع</a></p>
</main>
<div class="color-bars login-bars" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
<script type="module" src="/assets/js/admin/login.js"></script>
</body>
</html>
